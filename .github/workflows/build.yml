name: Build RSS feeds
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # 临时 RSSHub：feeds.json 中 "rsshub:/路由" 的源由它抓取，任务结束即销毁
    services:
      rsshub:
        image: diygod/rsshub:latest
        ports:
          - 1200:1200
        env:
          NODE_ENV: production
          CACHE_TYPE: memory
          REQUEST_TIMEOUT: "20000"
          LOGGER_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds
        env:
          RSSHUB_BASE: http://localhost:1200
          # 在仓库 Settings → Secrets and variables → Actions 里添加 YT_API_KEY；没有就退回旧的抓取方式
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/build_feeds.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
